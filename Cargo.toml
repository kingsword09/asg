[workspace]
members = ["asg", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/kingsword09/asg"
rust-version = "1.85.0"

[workspace.dependencies]
clap = { version = "4.5.46", features = ["derive"] }

[profile.release]
lto = true
opt-level = 3
