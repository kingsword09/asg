name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt,clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,taplo-cli
      - run: cargo +nightly x lint
      - run: cargo +nightly x test
      - run: cargo +nightly build -p asg --target wasm32-wasip2 --release

  publish:
    name: Publish to crates.io and npm
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    needs: check
    environment: release
    permissions:
      id-token: write # Required for OIDC token exchange
      contents: write # Required to push tags and create releases
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-wasip2
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version
      - name: Validate release version
        id: release
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          if [[ ! "$SUBJECT" =~ ^chore:\ release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release commit: $SUBJECT"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' asg/Cargo.toml | head -n 1)
          NPM_VERSION=$(node -p "require('./npm/package.json').version")

          if [[ "$CARGO_VERSION" != "$VERSION" || "$NPM_VERSION" != "$VERSION" ]]; then
            echo "::error::Release v$VERSION does not match Cargo $CARGO_VERSION and npm $NPM_VERSION"
            exit 1
          fi

          echo "Validated release v$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build npm package
        working-directory: npm
        run: |
          npm ci
          npm run build
      - name: Smoke test npm CLI filesystem
        working-directory: npm
        run: |
          OUTPUT="$RUNNER_TEMP/asg-smoke.svg"
          node bin/asg.mjs ../examples/demo.cast "$OUTPUT" --window
          test -s "$OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: |
          VERSION="${{ steps.release.outputs.number }}"
          CRATE_INDEX=$(curl --fail --silent --show-error https://index.crates.io/3/a/asg)
          if grep --fixed-strings --quiet "\"vers\":\"$VERSION\"" <<< "$CRATE_INDEX"; then
            echo "asg v$VERSION is already published on crates.io; skipping"
          else
            cargo publish -p asg
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish to npm
        working-directory: npm
        run: |
          VERSION="${{ steps.release.outputs.number }}"
          if npm view "@kingsword/asg@$VERSION" version >/dev/null 2>&1; then
            echo "@kingsword/asg v$VERSION is already published on npm; skipping"
          else
            npm publish --access public
          fi
      - name: Create GitHub Release
        if: ${{ steps.release.outputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
